<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>餐盘</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#292b28;background:#eaeae7}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;touch-action:manipulation}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #717c66;outline-offset:3px}button:disabled{opacity:.45}body{display:grid;place-items:center}.app{width:100%;height:100dvh;max-width:440px;position:relative;background:#f3f3ef;overflow:clip}.bar{position:absolute;z-index:3;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 18px 14px;background:#f3f3ef}.date-group{display:flex;align-items:center;gap:13px}.bar button{min-width:36px;height:40px}.date-input{border:0;background:transparent;font-size:16px;width:143px}.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.plate-zone{position:absolute;left:50%;top:100px;width:min(145%,610px);aspect-ratio:1;transform:translateX(-50%);touch-action:none;user-select:none}.plate-dial{width:100%;height:100%;display:block;overflow:visible;transform:rotate(var(--angle,0deg));transition:transform .42s cubic-bezier(.2,.7,.2,1)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:#fafaf7;border:1px solid #dedfd8;font-size:17px;font-variant-numeric:tabular-nums}.board{position:absolute;z-index:2;left:14px;right:14px;top:47%;bottom:max(16px,env(safe-area-inset-bottom));padding:22px;background:#fff;border:1px solid #dedfd8;border-radius:3px;overflow:auto;box-shadow:0 -3px 15px #32382903}.head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}.head h1{font-size:23px;font-weight:500;margin:0}.head time{font-size:13px;color:#777c72}.tabs{display:flex;gap:25px;border-bottom:1px solid #e8e9e2;margin-bottom:14px}.tab{padding:0 0 12px;font-size:13px;color:#7b8076}.tab.active{color:#30392b;border-bottom:2px solid #737e66}.empty{height:30px;display:grid;place-content:center;margin:5px 0 16px;color:#9a9e95;font-size:13px}.photo-row{display:flex;gap:15px;align-items:center;margin-bottom:18px}.thumb{width:82px;height:82px;background:#f6f6f2;flex:none;padding:0}.thumb svg{width:100%;height:100%}.photo-meta{display:flex;flex-direction:column;gap:9px}.photo-meta strong{font-weight:500;font-size:14px}.link{font-size:12px;color:#737d66;text-decoration:underline;text-underline-offset:3px;text-align:left;padding:0}.field{display:grid;grid-template-columns:48px 1fr;align-items:start;padding:13px 0;border-top:1px solid #ecece7;font-size:13px}.field label{color:#777e70;padding-top:5px}.field input,.field textarea{border:0;border-radius:0;outline-offset:0;width:100%;padding:5px 0;background:transparent;resize:vertical;font-size:13px;line-height:1.5}.field input::placeholder,.field textarea::placeholder{color:#a0a499}.primary{min-height:45px;background:#414b39;color:#fff;border-radius:4px;width:100%;padding:10px 15px}.upload-action{margin-top:14px}.error{color:#9b3e35;font-size:12px;line-height:1.6;margin:10px 0 0}#modal,#viewer-root{position:absolute;inset:0;pointer-events:none}#modal{z-index:10}#viewer-root{z-index:20}#modal>*,#viewer-root>*{pointer-events:auto}.modal-root:empty{display:none}.overlay{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:#33392d26;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);padding:16px}.dialog{width:100%;max-height:96%;overflow:auto;background:#fafaf7;border:1px solid #e0e1db;border-radius:6px;animation:appear .25s ease-out}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;font-size:14px}.close{height:36px;min-width:36px;font-size:24px;font-weight:300}.full-plate{overflow:hidden;position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none}.full-plate .hub{width:55px;height:55px;font-size:14px}.dialog-foot{padding:18px;display:flex;gap:10px;align-items:center}.dialog-foot button{flex:1}.subtle{min-height:44px;border:1px solid #d7dacd;border-radius:4px;background:transparent;font-size:13px}.crop-dialog{padding-bottom:18px}.crop-stage{position:relative;aspect-ratio:1;width:100%;background:#dddeda;overflow:hidden;touch-action:none;cursor:grab}.crop-stage img{position:absolute;max-width:none;pointer-events:none;user-select:none}.crop-mask{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.crop-controls{padding:16px 18px 0;display:flex;flex-direction:column;gap:16px}.crop-controls input[type=range]{width:100%;accent-color:#68775b}.zoom-label{white-space:nowrap;display:flex;align-items:center;gap:14px;font-size:12px;color:#6f7766}.viewer{position:absolute;z-index:20;inset:0;background:#171916ec;display:flex;align-items:center;justify-content:center;padding:55px 10px}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer .close{position:absolute;right:15px;top:15px;color:#fff}.download{position:absolute;bottom:14px;padding:12px 25px;background:#fff;color:#30362a;text-decoration:none;border-radius:4px}.viewer-title{position:absolute;left:20px;top:26px;color:#d5d8cf;font-size:12px}.share-error{font-size:12px;color:#914137;margin:0 18px 15px}.pulse{animation:appear .22s ease-out}@keyframes appear{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}@media(min-width:700px){.app{height:min(900px,calc(100dvh - 28px));border:1px solid #d8d9d1;border-radius:6px}}@media(max-height:660px){.plate-zone{top:78px;width:125%}.board{top:42%;padding:16px}.empty{height:45px}.head{margin-bottom:12px}.tabs{margin-bottom:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="app" id="app"><header class="bar"><div class="date-group"><button aria-label="前一天" data-action="prev">‹</button><input id="date" class="date-input" type="date" aria-label="日期"><button aria-label="后一天" data-action="next">›</button></div><button data-action="expand" aria-label="展开餐盘"><svg class="icon" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button></header><div class="plate-zone" id="plate-zone" aria-label="下拉展开餐盘"><svg id="dial" class="plate-dial" viewBox="-200 -200 400 400" role="img" aria-label="当日餐盘"></svg><button class="hub" data-action="now" aria-label="回到当前时间"></button></div><section class="board" id="board" aria-label="这一餐的信息"></section><div id="modal" class="modal-root"></div><div id="viewer-root"></div><input type="file" id="upload" accept="image/*" hidden></main>
<script>
'use strict';
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
let meals=[]; const clock=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let day=dateKey(new Date()),selected='entry', angle=0, modal=null, editor=null, gesture=null, db, activeOriginalUrl=null;
const cache=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>meals.find(m=>m.id===selected),key=()=>day+':'+selected;
function polar(r,a){const t=(a-90)*Math.PI/180;return [r*Math.cos(t),r*Math.sin(t)]}
function sector(w=360/Math.max(meals.length,1)){if(w>=359)return 'M0 -165 A165 165 0 1 1 0 165 A165 165 0 1 1 0 -165 Z M0 -44 A44 44 0 1 0 0 44 A44 44 0 1 0 0 -44 Z';const a=polar(165,-w/2+1),b=polar(165,w/2-1),c=polar(44,w/2-1),d=polar(44,-w/2+1);return `M${a} A165 165 0 ${w>180?1:0} 1 ${b} L${c} A44 44 0 ${w>180?1:0} 0 ${d} Z`}
function node(tag,attrs={}){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
function drawPlate(svg,compact=false){svg.replaceChildren();svg.append(node('image',{href:'plate.webp',x:-200,y:-200,width:400,height:400}));const defs=node('defs');svg.append(defs);
 meals.forEach((m,i)=>{const turn=i*360/meals.length,g=node('g',{'data-meal':m.id,transform:`rotate(${turn})`}),path=sector(),clipId=svg.id+'-clip-'+i,cp=node('clipPath',{id:clipId});cp.append(node('path',{d:path}));defs.append(cp);const rec=cache.get(day+':'+m.id);
 if(rec?.cropUrl)g.append(node('image',{href:rec.cropUrl,x:-200,y:-200,width:400,height:400,'clip-path':`url(#${clipId})`}));
 g.append(node('path',{d:path,fill:rec?.cropUrl?'transparent':'#ffffff04',stroke:m.id===selected?'#78816c':'#bfc3b5','stroke-width':m.id===selected?1.5:.7}));
 if(!rec?.cropUrl){const t=node('text',{x:0,y:-108,'text-anchor':'middle',fill:'#8b9281','font-size':11});t.textContent=m.time;g.append(t);const t2=node('text',{x:0,y:-86,'text-anchor':'middle',fill:'#979e8e','font-size':17});t2.textContent='＋';g.append(t2)}svg.append(g)});
 svg.style.setProperty('--angle',angle+'deg');}
function draw(){ meals=[...cache.values()].filter(r=>r.key.startsWith(day+':')&&(r.original||r.foods||r.note||r.entryTime)).map(r=>({id:r.key.slice(11),name:'这一餐',time:r.entryTime||'12:00'})).sort((a,b)=>a.time.localeCompare(b.time));if(!meals.length)meals=[{id:'entry',name:'这一餐',time:clock()}];if(!meals.some(m=>m.id===selected))selected=meals[meals.length-1].id; $('date').value=day; const idx=meals.findIndex(m=>m.id===selected);angle=-idx*360/meals.length;drawPlate($('dial'));const now=new Date();document.querySelectorAll('.hub').forEach(n=>n.textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}));drawBoard();if(modal==='plate')drawPlate($('full-dial'))}
function drawBoard(){const m=current(),r=cache.get(key())||{};$('board').innerHTML=`<div class="head"><h1>${m.name}</h1><time>${m.time}</time><button class="link" style="margin-left:auto" data-action="add-record">＋ 添加</button></div>${r.cropUrl?`<div class="photo-row"><button class="thumb" data-action="original" aria-label="查看原图"><svg viewBox="-200 -200 400 400"><image href="${r.cropUrl}" x="-200" y="-200" width="400" height="400"/></svg></button><div class="photo-meta"><strong>${esc(r.fileName||'餐食照片')}</strong><button class="link" data-action="original">查看原图</button><button class="link" data-action="recrop">调整裁剪</button><button class="link" data-action="remove-photo">删除照片</button></div></div>`:'<div class="empty">还没有照片</div>'}<div class="field"><label for="foods">食物</label><input id="foods" data-field="foods" value="${esc(r.foods)}" placeholder="填写食物名称"></div><div class="field"><label for="note">备注</label><textarea id="note" data-field="note" rows="1" placeholder="添加备注">${esc(r.note)}</textarea></div><button class="primary upload-action" data-action="upload">${r.cropUrl?'更换照片':'添加照片'}</button><p id="error" class="error" role="status" hidden></p>`;}
function error(text){const el=$('error');if(el){el.hidden=false;el.textContent=text}}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('plate-ui-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('meals',{keyPath:'key'});req.onsuccess=()=>{db=req.result;resolve()};req.onerror=()=>reject(req.error)})}
function readAll(){return new Promise((resolve,reject)=>{const q=db.transaction('meals').objectStore('meals').getAll();q.onsuccess=()=>{q.result.forEach(r=>{if(r.crop)r.cropUrl=URL.createObjectURL(r.crop);cache.set(r.key,r)});resolve()};q.onerror=()=>reject(q.error)})}
function persist(r){return new Promise((resolve,reject)=>{const tx=db.transaction('meals','readwrite'),{cropUrl,...saved}=r;tx.objectStore('meals').put(saved);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function saveField(el){const k=key(),r={...(cache.get(k)||{}),key:k,[el.dataset.field]:el.value,entryTime:current().time};if(!db){error('本机存储不可用，请稍后重试');return}try{await persist(r);cache.set(k,r)}catch{error('没有保存成功，请重试')}}
function setDay(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return;day=value;draw()}
function openPlate(){modal='plate';$('modal').innerHTML=`<div class="overlay" data-action="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-label="完整餐盘"><div class="dialog-head"><span>${esc(day)} · 餐盘</span><button class="close" data-action="close" aria-label="关闭">×</button></div><div class="full-plate" id="full-plate"><svg class="plate-dial" id="full-dial" viewBox="-200 -200 400 400" role="img" aria-label="完整餐盘图片"></svg><button class="hub" data-action="now" aria-label="回到当前时间"></button></div><div class="dialog-foot"><button class="subtle" data-action="original" ${cache.get(key())?.original?'':'disabled'}>查看原图</button><button class="primary" data-action="share">保存餐盘图片</button></div><p class="share-error" id="share-error" hidden></p></section></div>`;draw();$('modal').querySelector('.close').focus({preventScroll:true})}
function closeModal(){if(editor?.url)URL.revokeObjectURL(editor.url);editor=null;modal=null;$('modal').replaceChildren();$('board').style.transform='';$('plate-zone').style.transform='';$('app').querySelector('[data-action="expand"]').focus({preventScroll:true})}
async function original(){const r=cache.get(key());if(!r?.original)return;if(activeOriginalUrl)URL.revokeObjectURL(activeOriginalUrl);activeOriginalUrl=URL.createObjectURL(r.original);$('viewer-root').innerHTML=`<div class="viewer" role="dialog" aria-modal="true" aria-label="原图"><span class="viewer-title">原图</span><button class="close" data-action="close-viewer" aria-label="关闭原图">×</button><img alt="上传的原始照片"></div>`;$('viewer-root').querySelector('img').src=activeOriginalUrl;$('viewer-root').querySelector('button').focus({preventScroll:true})}
function closeViewer(){$('viewer-root').replaceChildren();if(activeOriginalUrl){URL.revokeObjectURL(activeOriginalUrl);activeOriginalUrl=null}if(modal==='plate')$('modal').querySelector('.close').focus({preventScroll:true});else $('board').querySelector('[data-action="original"]')?.focus({preventScroll:true})}
async function crop(file){if(!file?.type.startsWith('image/')){error('请选择图片文件');return}if(file.size>30*1024*1024){error('请选择小于 30 MB 的图片');return}const url=URL.createObjectURL(file),img=new Image();try{await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url})}catch{URL.revokeObjectURL(url);error('无法读取这张图片，请换用 JPG、PNG 或 WebP');return}
 if(editor?.url)URL.revokeObjectURL(editor.url);editor={file,url,img,z:1,x:200,y:200,base:Math.max(400/img.naturalWidth,400/img.naturalHeight),key:key(),meal:selected};modal='crop';$('modal').innerHTML=`<div class="overlay"><section class="dialog crop-dialog" role="dialog" aria-modal="true" aria-label="裁剪照片"><div class="dialog-head"><span>裁剪照片</span><button class="close" data-action="close" aria-label="取消裁剪">×</button></div><div id="crop-stage" class="crop-stage" aria-label="拖动照片调整位置"><img id="crop-image" alt="待裁剪照片" draggable="false"><svg class="crop-mask" viewBox="-200 -200 400 400"><defs><mask id="crop-mask"><rect x="-200" y="-200" width="400" height="400" fill="white"/><path d="${sector()}" fill="black"/></mask></defs><rect x="-200" y="-200" width="400" height="400" fill="#252a23aa" mask="url(#crop-mask)"/><path d="${sector()}" fill="none" stroke="white" stroke-width="1.5"/></svg></div><div class="crop-controls"><label class="zoom-label">缩放<input id="zoom" type="range" min="1" max="4" step="0.01" value="1"></label><button class="primary" data-action="save-crop">使用照片</button><p id="crop-error" class="error" role="status" hidden></p></div></section></div>`;$('crop-image').src=url;positionImage();$('modal').querySelector('.close').focus({preventScroll:true})}
function positionImage(){if(!editor)return;const e=editor,w=e.img.naturalWidth*e.base*e.z,h=e.img.naturalHeight*e.base*e.z;e.x=Math.max(400-w/2,Math.min(w/2,e.x));e.y=Math.max(400-h/2,Math.min(h/2,e.y));const el=$('crop-image');el.style.width=w/4+'%';el.style.height=h/4+'%';el.style.left=(e.x-w/2)/4+'%';el.style.top=(e.y-h/2)/4+'%'}
async function saveCrop(){if(!editor||!db)return;const e=editor,button=$('modal').querySelector('[data-action="save-crop"]');button.disabled=true;try{const c=document.createElement('canvas');c.width=c.height=1000;const g=c.getContext('2d');g.scale(2.5,2.5);g.translate(200,200);g.clip(new Path2D(sector()));g.translate(-200,-200);const w=e.img.naturalWidth*e.base*e.z,h=e.img.naturalHeight*e.base*e.z;g.drawImage(e.img,e.x-w/2,e.y-h/2,w,h);const blob=await new Promise(res=>c.toBlob(res,'image/png'));if(!blob)throw Error('crop');const old=cache.get(e.key)||{},r={...old,key:e.key,original:e.file,crop:blob,entryTime:current().time,fileName:e.file.name||old.fileName||'餐食照片'};await persist(r);if(old.cropUrl)URL.revokeObjectURL(old.cropUrl);r.cropUrl=URL.createObjectURL(blob);cache.set(e.key,r);closeModal();draw()}catch{const n=$('crop-error');n.hidden=false;n.textContent='照片没有保存成功，请重试';button.disabled=false}}
async function exportPlateImage(){const err=$('share-error'),btn=$('modal').querySelector('[data-action=share]');btn.disabled=true;btn.textContent='生成中…';try{const load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;setTimeout(()=>reject(Error('timeout')),8000);im.src=src});const plate=await load('plate.webp'),c=document.createElement('canvas');c.width=1200;c.height=1320;const g=c.getContext('2d');g.fillStyle='#f8f8f4';g.fillRect(0,0,1200,1320);g.drawImage(plate,0,40,1200,1200);for(let i=0;i<meals.length;i++){const r=cache.get(day+':'+meals[i].id);if(!r?.cropUrl)continue;const im=await load(r.cropUrl);g.save();g.translate(600,640);g.rotate(i*2*Math.PI/meals.length);g.drawImage(im,-600,-600,1200,1200);g.restore()}g.fillStyle='#535d4a';g.font='28px sans-serif';g.textAlign='center';g.fillText(day,600,1280);const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('export');if(activeOriginalUrl)URL.revokeObjectURL(activeOriginalUrl);activeOriginalUrl=URL.createObjectURL(blob);$('viewer-root').innerHTML=`<div class="viewer" role="dialog" aria-modal="true" aria-label="餐盘分享图片"><span class="viewer-title">餐盘图片</span><button class="close" data-action="close-viewer" aria-label="关闭图片">×</button><img alt="生成的餐盘图片"><a class="download" download="餐盘-${esc(day)}.png">下载图片</a></div>`;$('viewer-root').querySelector('img').src=activeOriginalUrl;$('viewer-root').querySelector('a').href=activeOriginalUrl;$('viewer-root').querySelector('button').focus({preventScroll:true})}catch{err.hidden=false;err.textContent='图片未能生成，请重试'}finally{btn.disabled=false;btn.textContent='保存餐盘图片'}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='add-record'){const id='r'+Date.now(),r={key:day+':'+id,entryTime:clock()};try{await persist(r);cache.set(r.key,r);selected=id;draw()}catch{error('未能添加，请重试')}}else if(a==='select'){selected=el.dataset.meal;draw()}else if(a==='prev'||a==='next'){const d=new Date(day+'T12:00:00');d.setDate(d.getDate()+(a==='next'?1:-1));setDay(dateKey(d))}else if(a==='now'){day=dateKey(new Date());selected='entry';draw()}else if(a==='expand')openPlate();else if(a==='close')closeModal();else if(a==='backdrop'&&e.target===el)closeModal();else if(a==='upload')$('upload').click();else if(a==='recrop'){const r=cache.get(key());if(r?.original)crop(r.original)}else if(a==='remove-photo'){const r=cache.get(key());if(r){const {original,crop,cropUrl,fileName,...rest}=r;try{await persist(rest);if(cropUrl)URL.revokeObjectURL(cropUrl);cache.set(key(),rest);draw()}catch{error('未能删除照片，请重试')}}}else if(a==='original')original();else if(a==='close-viewer')closeViewer();else if(a==='save-crop')saveCrop();else if(a==='share')exportPlateImage()});
document.addEventListener('change',e=>{if(e.target.id==='date')setDay(e.target.value);else if(e.target.id==='upload'){const f=e.target.files[0];e.target.value='';if(f)crop(f)}else if(e.target.dataset.field)saveField(e.target)});
document.addEventListener('input',e=>{if(e.target.id==='zoom'&&editor){editor.z=+e.target.value;positionImage()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('viewer-root').firstChild)closeViewer();else if(modal)closeModal()}});
document.addEventListener('pointerdown',e=>{const stage=e.target.closest('#crop-stage'),plate=e.target.closest('#plate-zone,#full-plate');if(stage&&editor){stage.setPointerCapture(e.pointerId);gesture={kind:'crop',x:e.clientX,y:e.clientY,ox:editor.x,oy:editor.y,scale:400/stage.clientWidth,id:e.pointerId}}else if(plate&&!e.target.closest('button')){plate.setPointerCapture(e.pointerId);gesture={kind:plate.id==='plate-zone'?'expand':'rotate',x:e.clientX,y:e.clientY,angle,id:e.pointerId,el:plate,moved:false}}});
document.addEventListener('pointermove',e=>{const p=gesture;if(!p||p.id!==e.pointerId)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(p.kind==='crop'&&editor){editor.x=p.ox+dx*p.scale;editor.y=p.oy+dy*p.scale;positionImage()}else if(p.kind==='expand'){p.moved=Math.hypot(dx,dy)>8;if(dy>0){p.el.style.transform=`translate(-50%,${Math.min(dy*.45,60)}px)`;$('board').style.transform=`translateY(${Math.min(dy*.08,12)}px)`}}else if(p.kind==='rotate'){p.moved=Math.hypot(dx,dy)>8;angle=p.angle+dx*.55;$('full-dial').style.setProperty('--angle',angle+'deg')}});
document.addEventListener('pointerup',e=>{const p=gesture;if(!p||p.id!==e.pointerId)return;gesture=null;if(p.kind==='crop')return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(p.kind==='expand'){p.el.style.transform='';$('board').style.transform='';if(dy>48&&Math.abs(dy)>Math.abs(dx))openPlate();else if(!p.moved){const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-meal]');if(hit){selected=hit.dataset.meal;draw()}}}else if(p.kind==='rotate'){if(p.moved){const idx=((Math.round(-angle/(360/meals.length))%meals.length)+meals.length)%meals.length;selected=meals[idx].id;draw()}else{const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-meal]');if(hit){selected=hit.dataset.meal;draw();if(cache.get(key())?.original)original()}}}});
document.addEventListener('pointercancel',()=>{if(gesture?.kind==='expand'){gesture.el.style.transform='';$('board').style.transform=''}gesture=null});
draw();openDB().then(readAll).then(draw).catch(()=>error('本机存储不可用，照片暂时无法保存'));
</script></body></html>
